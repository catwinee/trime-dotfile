# ============================================================================
#  Rime 全局配置 —— 方案菜单
# ----------------------------------------------------------------------------
#  这个文件 patch 的是同文自带的 default.yaml。
#  手机上的路径：
#    /sdcard/Android/data/com.osfans.trime/files/rime/default.custom.yaml
#
#  只有这里列出的方案才会出现在「方案选单」里，也只会在部署时被编译。
#  没列出的方案（哪怕文件躺在隔壁）不会加载，这样部署快、候选栏也干净。
# ============================================================================

patch:

  # ---- 方案列表（顺序即方案选单里的顺序）-----------------------------------
  schema_list:
    - schema: luna_pinyin        # 朙月拼音：全拼。简繁靠 simplification 开关切
    - schema: luna_pinyin_simp   # 朙月拼音·简化字：固定输出简体

    # 想要笔画输入（不会读的字用手机查）就取消下面这行的注释，再重新部署。
    # stroke 的词典和 schema 在同文预设目录里，已经能看到，不用额外下载。
    # - schema: stroke

  # ---- 每页候选数 ----------------------------------------------------------
  # 预设是 5。调大 = 候选栏一次显示更多词，需要点最右边那个 ▼ 展开的次数更少。
  # 注意一定要写成 menu/page_size 这种完整路径：patch 是整块替换，
  # 写 menu: 再把整个 menu 抄一遍会连带影响别的东西。
  menu/page_size: 8

  # ---- 句首自动大写 / Shift 行为 -------------------------------------------
  # 完全沿用同文预设 default.yaml 的设定，故意没有在这里覆盖：
  # ascii_composer 的 switch_key 会与按键上的 shift_lock 交互，改之前先想清楚。
  # 需要改再取消注释：
  #
  # ascii_composer:
  #   good_old_caps_lock: true
  #   switch_key:
  #     Shift_L: inline_ascii
  #     Shift_R: commit_text
  #     Caps_Lock: clear

  # ---- 方案选单标题（预设是繁体「〔方案選單〕」）----
  switcher/caption: "〔方案选单〕"

