  preset_keys/Henkan/states: ["繁体", "简体"]
  preset_keys/Hide/label: "隐藏"
  preset_keys/Hint_switch/states: ["有助记", "无助记"]
  preset_keys/Homepage/label: "同文主页"
  preset_keys/IME_last/label: "上一输入法"
  preset_keys/IME_next/label: "下一输入法"
  preset_keys/Info/label: "关于"
  preset_keys/Keyboard_number/label: "数字"
  preset_keys/Keyboard_switch/label: "键盘"
  preset_keys/Keyboard_symbols/label: "符号"
  preset_keys/MUSIC/label: "音乐"
  preset_keys/POWER/label: "电源"
  preset_keys/Page_Down/label: "下页"
  preset_keys/Page_Up/label: "上页"
  preset_keys/SEARCH/label: "搜寻"
