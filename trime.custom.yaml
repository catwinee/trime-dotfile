  preset_keys/copy_all/label: "全誊"
  preset_keys/paste/label: "贴上"
  preset_keys/paste_text/label: "贴上文本"
  preset_keys/select_all/label: "全选"
  preset_keys/undo/label: "撤销"
  preset_keyboards/array30/name: "行列30配美式国际"
  preset_keyboards/bopomofo/name: "注音键盘"
  preset_keyboards/cangjie5/name: "仓颉五代键盘"
  preset_keyboards/cangjie6/name: "仓颉六代"
  preset_keyboards/number/name: "预设数字"
  preset_keyboards/qwerty0/name: "预设36键"
  preset_keyboards/qwerty_/name: "预设30键"
  preset_keyboards/stroke/name: "五笔画键盘"
  preset_keyboards/symbols/name: "符号"
  preset_keyboards/telegraph/name: "电码"
  preset_keyboards/terra_pinyin/name: "地球拼音键盘"
  preset_keyboards/us_intl/name: "美式国际"


  # ==========================================================================
  #  6. 空格键：去掉文字 + 加上下左右手势
  # ==========================================================================
  #  【文字】同文只在按键自身没写 label 时才把方案名画到空格上
  #  （KeyAction.kt:158: code==SPACE && label.isEmpty() → schemaName）。
  #  PresetKey 模型里确实有 label 字段，所以改 preset_keys/space 一处，
  #  所有用 {click: space} 的键盘（number / letter / qwerty0 / bopomofo /
  #  cangjie5 / stroke / … 共 15 副）一起生效。
  #  （space1 那个键没有任何键盘在用，不用管。）
  # ==========================================================================

  preset_keys/space/label: " "

  # --------------------------------------------------------------------------
  #  【手势】PresetKey 模型里没有 swipe 字段，所以手势只能逐个键盘写在键上。
  #  这里补 number（数字面板）和 letter（英文面板）；
  #  中英文主键盘 default/qwerty 和符号面板 symbols 写在前面第 1 节的键定义里。
  #
  #  为什么用方向键：
  #    librime 的 selector 在候选态用 Horizontal | Stacked 那套绑定
  #    （selector.cc:33 / 129）：
  #        Up  -> 上一个候选      Down -> 下一个候选
  #        PgUp -> 上一页         PgDn -> 下一页
  #        左右**不绑定** -> 落到 navigator（编码串内移动）
  #    所以上/下滑在"有候选"时选候选、"无候选"时是光标上下；
  #    左/右滑始终是光标左右。翻页交给 , / .（key_binder 的
  #    paging_with_comma_period）。
  #  ------------------------------------------------------------------------
  #  注意：letter 的键位原本来自 __include: /preset_keyboards/default，
  #  而 __include 在 patch 之前就解析完了，所以这里用 ref 里原版 default
  #  的键位当基线（带原版的 40 键布局，不是我们现在这版 26 键）。
  #  --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  #  letter（英文面板）的完整键位
  #  --------------------------------------------------------------------------
  #  为什么要把整份 keys 抄一遍：它原本是
  #      __include: /preset_keyboards/default
  #  而 __include 在 patch 之前就解析完了，所以 patch preset_keyboards/default
  #  传不到它身上。这里用 ref/ 里原版 default 的 40 键当基线，只改空格那一个键
  #  （去文字 + 四向手势），其余保持同文原样。
  #
  #  ⚠️ 因此它仍是原版的 40 键布局，连全套原版长按都在（数字键出符号、a 全选、
  #     x 剪切、回车「编码」……），和主键盘那副 26 键完全不一致。
  #     要统一就得在这里把 keys 整体重写，别指望改 default 能带过来。
  # --------------------------------------------------------------------------
  preset_keyboards/letter/keys:
    - {click: '1', long_click: '!'}
    - {click: '2', long_click: '@'}
    - {click: '3', long_click: '#'}
    - {click: '4', long_click: $}
    - {click: '5', long_click: '%'}
    - {click: '6', long_click: ^}
    - {click: '7', long_click: '&'}
    - {click: '8', long_click: '*'}
    - {click: '9', long_click: (}
    - {click: '0', long_click: )}
    - {click: q, long_click: _}
    - {click: w, long_click: '-'}
    - {click: e, long_click: +}
    - {click: r, long_click: '='}
    - {click: t, long_click: '|'}
    - {click: y, long_click: \}
    - {click: u, long_click: '['}
    - {click: i, long_click: ']'}
    - {click: o, long_click: '{'}
    - {click: p, long_click: '}'}
    - {click: a, long_click: select_all}
    - {click: s, long_click: Home}
    - {click: d, long_click: End}
    - {click: f, long_click: Page_Up}
    - {click: g, long_click: Page_Down}
    - {click: h, long_click: Left}
    - {click: j, long_click: Down}
    - {click: k, long_click: Up}
    - {click: l, long_click: Right}
    - {click: ;, long_click: ':'}
    - {click: z, long_click: '`'}
    - {click: x, long_click: cut}
    - {click: c, long_click: copy}
    - {click: v, long_click: paste}
    - {click: b, long_click: '~'}
    - {click: n, long_click: Insert}
    - {click: m, long_click: Delete}
    - {click: ',', long_click: <}
    - {click: ., long_click: '>'}
    - {click: /, long_click: '?'}
    - {click: Shift_L}
    - {click: Keyboard_symbols, long_click: Keyboard_number}
    - {click: Mode_switch, long_click: Menu}
    - {click: space, label: ' ', swipe_left: Left, swipe_right: Right, swipe_up: Up, swipe_down: Down, width: 30}
    - {click: '''', long_click: '"'}
    - {click: BackSpace, width: 15}
    - {click: Return, composing: Return1, long_click: CommitComment, width: 15}

  # --------------------------------------------------------------------------
  #  number（数字面板）的完整键位
  #  --------------------------------------------------------------------------
  #  累积到现在的改动（相对同文原版）：
  #    [0]  +           ->  = 上滑 +
  #    [5]  -           ->  - 上滑 _
  #    [4]  #           ->  # 上滑 %
  #    [9]  %           ->  ¥ 上滑 $        （人民币符号）
  #    [10] *           ->  * 上滑 /
  #    [14] :           ->  : 上滑 ;
  #    [18] .           ->  √ 上滑 ²
  #    [19] ,           ->  退格 上滑 清空
  #    原 [20] 的 =      ->  移除
  #    底行重排          ->  返回(10) .，(10) 空格(50) /(10) 回车(20) = 100
  #                          返回放在最左、宽 10，与主键盘「123」键同位同宽
  #    空格              ->  label 去掉方案名 + 四向手势
  #  这里一个长按都没有（原版「返回」上那个跳符号面板的长按也已去掉）。
  # --------------------------------------------------------------------------
  preset_keyboards/number/keys:
    - {click: '=', label_symbol: +, swipe_up: +}
    - {click: KP_1}
    - {click: KP_2}
    - {click: KP_3}
    - {click: '#', label_symbol: '%', swipe_up: '%'}
    - {click: '-', label_symbol: _, swipe_up: _}
    - {click: KP_4}
    - {click: KP_5}
    - {click: KP_6}
    - {click: ¥, label_symbol: $, swipe_up: $}
    - {click: '*', label_symbol: /, swipe_up: /}
    - {click: KP_7}
    - {click: KP_8}
    - {click: KP_9}
    - {click: ':', label_symbol: ;, swipe_up: ;}
    - {click: /}
    - {click: ±}
    - {click: KP_0}
    - {click: √, label_symbol: ², swipe_up: ²}
    - {click: BackSpace, label_symbol: 清空, swipe_up: Clear}
    - {click: Keyboard_default, width: 10}
    - {click: ',', label: '，', ascii: ',', label_symbol: '.', swipe_up: '.', width: 10}
    - {click: space, label: ' ', swipe_left: Left, swipe_right: Right, swipe_up: Up, swipe_down: Down, width: 50}
    - {click: /, label_symbol: '?', swipe_up: '?', width: 10}
    - {click: Return, width: 20}
